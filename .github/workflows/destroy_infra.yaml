name: Destroy Infrastructure

on:
  workflow_dispatch:


jobs:
  terraform:
    runs-on: [Linux]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name:
        run: terraform init
        working-directory: MagicVilla_VillaAPI/Terraform/env/prod

      - name: Terraform Destroy
        run: terraform destroy -auto-approve
        working-directory: MagicVilla_VillaAPI/Terraform/env/prod
